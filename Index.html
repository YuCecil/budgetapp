<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>白花嘉麗媽記帳APP</title>

    <!-- 加到主畫面：Android / Chrome 讀 manifest，iOS 讀下面這幾個 meta -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F59E0B">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="記帳">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>

    <!-- 引入漂亮的圓潤字體 Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'], // 預設替換為 Noto Sans
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.4s ease-out forwards',
                        'bounce-slight': 'bounceSlight 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(15px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        bounceSlight: {
                            '0%': { opacity: '0', transform: 'scale(0.9) translateY(10px)' },
                            '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .animate-spin {
            animation: spin 1s linear infinite;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        body {
            -webkit-tap-highlight-color: transparent;
        }

        input[type="month"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            filter: invert(1);
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        input[type="month"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }

        /* 讓交錯動畫依序進入 */
        .stagger-1 {
            animation-delay: 50ms;
        }

        .stagger-2 {
            animation-delay: 100ms;
        }

        .stagger-3 {
            animation-delay: 150ms;
        }

        .stagger-4 {
            animation-delay: 200ms;
        }

        .stagger-5 {
            animation-delay: 250ms;
        }

        /* 玻璃質感共用 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body class="bg-amber-50 text-gray-800 h-screen overflow-hidden selection:bg-amber-200 antialiased">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        // ==========================================
        // 請將您的 Google Apps Script 網址貼在下方引號中
        // ==========================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQcuqkmZhXQHpJDGUOoOxWQhZXS_NhPAD0Trl7lGz4cbLJio9VasesWnjv2yTYqs_bfQ/exec";
        // ==========================================
        // 通行碼存放在使用者自己的瀏覽器裡，程式碼中不含任何密碼
        const TOKEN_STORAGE_KEY = 'budgetapp_token';
        // 單次請求最長等待時間；超過就中止並提示，避免無限轉圈
        const REQUEST_TIMEOUT_MS = 30000;
        // ==========================================

        const { useState, useEffect, useRef, useMemo } = React;

        // --- Icons ---
        const Icons = {
            Home: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>,
            List: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>,
            PieChart: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 12 2.5 10"></path><path d="M12 12V2.5"></path><path d="M12 12 18 20"></path></svg>,
            Send: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>,
            Trash: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Sparkles: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>,
            Plus: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Edit: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
            Help: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>,
            Copy: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>,
            Refresh: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>,
            Cloud: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg>,
            Folder: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        };

        const COLORS = ['#F59E0B', '#D97706', '#B45309', '#78350F', '#FCD34D', '#84CC16', '#10B981'];
        const formatNumber = (num) => new Intl.NumberFormat('zh-TW').format(num || 0); // 防呆: 如果是 undefined 則顯示 0

        // --- Components ---
        // ==========================================================
        // 統計頁
        // ----------------------------------------------------------
        // 這裡刻意不用圓餅圖：類別有十幾個時，圓餅會變成一堆看不懂的小碎片，
        // 而且顏色不夠用、金額還得逐塊點開才看得到。
        // 改成「排行長條 + 每日節奏」，一眼就能讀到數字。
        //
        // 顏色只用一種琥珀色，負責表示「多寡」；類別身分交給旁邊的文字。
        // 超支才會出現紅色，而且一定伴隨文字說明，不單靠顏色傳達。
        // ==========================================================
        const MARK = '#D97706';      // 資料主色，白底對比 3:1 以上
        const TRACK = '#FCEBD2';     // 長條底軌
        const OVER = '#DC2626';      // 超支（狀態色，不當作類別色使用）

        const StatSection = ({ title, note, children }) => (
            <div className="bg-white rounded-2xl p-4 shadow-sm border border-amber-100">
                <div className="flex items-baseline justify-between mb-3 gap-2">
                    <h3 className="font-bold text-amber-900 text-sm">{title}</h3>
                    {note && <span className="text-[11px] text-gray-400 flex-shrink-0">{note}</span>}
                </div>
                {children}
            </div>
        );

        const StatsView = ({ categories, groups, history, currentMonth, isLoading }) => {
            const [activeDay, setActiveDay] = useState(null);

            // --- 預算總額：與首頁同一套算法，群組有明確預算就用它 ---
            const explicit = {};
            (groups || []).forEach(g => { if (g.explicit) explicit[g.name] = g.budget; });
            const groupNames = [...new Set(categories.map(c => c.group).filter(Boolean))];
            const sumOf = (fn) => categories.reduce((a, c) => a + (fn(c) ? (Number(c.budget) || 0) : 0), 0);
            const totalBudget = sumOf(c => !c.group) + groupNames.reduce(
                (a, n) => a + (explicit[n] !== undefined ? explicit[n] : sumOf(c => c.group === n)), 0);
            const totalSpent = categories.reduce((a, c) => a + (Number(c.spent) || 0), 0);
            const remaining = totalBudget - totalSpent;

            // --- 這個月過了幾天 ---
            const [yy, mm] = currentMonth.split('-').map(Number);
            const daysInMonth = new Date(yy, mm, 0).getDate();
            const now = new Date();
            const isThisMonth = yy === now.getFullYear() && mm === now.getMonth() + 1;
            const daysPassed = isThisMonth ? now.getDate() : daysInMonth;
            const pacePct = (daysPassed / daysInMonth) * 100;
            const spentPct = totalBudget > 0 ? (totalSpent / totalBudget) * 100 : 0;

            // --- 類別排行 ---
            const ranked = categories
                .filter(c => (Number(c.spent) || 0) > 0)
                .map(c => ({ ...c, spent: Number(c.spent) || 0 }))
                .sort((a, b) => b.spent - a.spent);
            const maxSpent = ranked.length ? ranked[0].spent : 0;

            // --- 每日花費 ---
            const daily = {};
            (history || []).forEach(r => {
                const parts = String(r.date || '').replace(/-/g, '/').split('/');
                if (parts.length !== 3) return;
                const d = Number(parts[2]);
                if (d >= 1 && d <= 31) daily[d] = (daily[d] || 0) + (Number(r.amount) || 0);
            });
            const days = Array.from({ length: daysInMonth }, (_, i) => ({ day: i + 1, value: daily[i + 1] || 0 }));
            const maxDay = days.reduce((best, d) => d.value > best.value ? d : best, { day: 0, value: 0 });
            const spentDays = days.filter(d => d.value > 0).length;
            const avgPerDay = spentDays ? Math.round(totalSpent / daysPassed) : 0;

            // --- 最大的幾筆 ---
            const biggest = [...(history || [])]
                .sort((a, b) => (Number(b.amount) || 0) - (Number(a.amount) || 0))
                .slice(0, 5);

            const truncated = (history || []).length >= 200;

            if (isLoading && totalSpent === 0) {
                return (
                    <div className="p-4 h-full overflow-y-auto pb-24">
                        <div className="text-center p-8 text-amber-600 text-xs animate-pulse">正在讀取 {currentMonth} 資料...</div>
                    </div>
                );
            }

            if (totalSpent === 0) {
                return (
                    <div className="p-4 h-full overflow-y-auto pb-24">
                        <h2 className="text-xl font-bold mb-6 px-2 text-amber-900">{currentMonth} 統計</h2>
                        <div className="text-center text-gray-400 mt-20 flex flex-col gap-2">
                            <div className="text-4xl mb-2">🍃</div>
                            <span>本月還沒有花費紀錄</span>
                        </div>
                    </div>
                );
            }

            return (
                <div className="p-4 h-full overflow-y-auto pb-28 space-y-3">
                    <h2 className="text-xl font-bold px-2 pb-1 text-amber-900">{currentMonth} 統計</h2>

                    {/* ── 摘要：這是一個數字，不需要圖表 ── */}
                    <div className="bg-white rounded-2xl p-5 shadow-sm border border-amber-100 animate-fade-in-up">
                        <div className="text-xs text-gray-400 mb-1">本月已花</div>
                        <div className="text-4xl font-bold tracking-tight text-amber-900 mb-1">
                            ${formatNumber(totalSpent)}
                        </div>
                        <div className="text-sm text-gray-500 mb-4">
                            預算 ${formatNumber(totalBudget)}
                            <span className={remaining < 0 ? 'text-red-600 font-bold' : ''}>
                                {remaining < 0
                                    ? `　已超支 $${formatNumber(Math.abs(remaining))}`
                                    : `　還剩 $${formatNumber(remaining)}`}
                            </span>
                        </div>

                        {/* 進度條：實心是已花，細線是「今天」的位置 */}
                        <div className="relative h-2.5 rounded-full overflow-hidden mb-2" style={{ background: TRACK }}>
                            <div className="h-full rounded-full transition-all duration-500"
                                style={{ width: `${Math.min(100, spentPct)}%`, background: remaining < 0 ? OVER : MARK }} />
                        </div>
                        {isThisMonth && (
                            <div className="relative h-3 -mt-2 mb-1">
                                <div className="absolute top-0 w-px h-2.5 bg-amber-900/40"
                                    style={{ left: `${Math.min(100, pacePct)}%` }} />
                                <div className="absolute top-3 text-[10px] text-gray-400 -translate-x-1/2 whitespace-nowrap"
                                    style={{ left: `${Math.min(92, Math.max(8, pacePct))}%` }}>今天</div>
                            </div>
                        )}

                        <div className="flex items-center justify-between mt-5 pt-3 border-t border-gray-100 text-xs">
                            <span className="text-gray-400">
                                本月過了 <span className="font-mono font-bold text-gray-600">{daysPassed}/{daysInMonth}</span> 天
                            </span>
                            {totalBudget > 0 && (
                                <span className="text-gray-400">
                                    已用 <span className={`font-mono font-bold ${remaining < 0 ? 'text-red-600' : 'text-gray-600'}`}>{Math.round(spentPct)}%</span> 的預算
                                </span>
                            )}
                        </div>
                    </div>

                    {/* ── 類別排行：長條直接標數字，不用點就看得到 ── */}
                    <StatSection title="花在哪裡" note={`${ranked.length} 個類別`}>
                        <div className="space-y-3">
                            {ranked.map(c => {
                                const share = totalSpent > 0 ? (c.spent / totalSpent) * 100 : 0;
                                const budget = Number(c.budget) || 0;
                                // 群組成員的預算多半掛在群組上，單獨比較沒有意義，所以不標超支
                                const over = !c.group && budget > 0 && c.spent > budget;
                                return (
                                    <div key={c.id}>
                                        <div className="flex items-baseline justify-between gap-2 mb-1.5">
                                            <span className="text-sm text-gray-700 truncate">{c.name}</span>
                                            <span className="flex items-baseline gap-2 flex-shrink-0">
                                                {over && (
                                                    <span className="text-[10px] font-bold px-1.5 py-0.5 rounded"
                                                        style={{ color: OVER, background: '#FEE2E2' }}>
                                                        超支 ${formatNumber(c.spent - budget)}
                                                    </span>
                                                )}
                                                <span className="text-[11px] text-gray-400 font-mono tabular-nums">
                                                    {share < 1 ? '<1' : Math.round(share)}%
                                                </span>
                                                <span className="text-sm font-bold text-gray-800 font-mono tabular-nums">
                                                    ${formatNumber(c.spent)}
                                                </span>
                                            </span>
                                        </div>
                                        <div className="h-1.5 rounded-full overflow-hidden" style={{ background: TRACK }}>
                                            <div className="h-full rounded-full transition-all duration-500"
                                                style={{
                                                    width: `${maxSpent > 0 ? Math.max(2, (c.spent / maxSpent) * 100) : 0}%`,
                                                    background: over ? OVER : MARK
                                                }} />
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </StatSection>

                    {/* ── 每日節奏 ── */}
                    <StatSection
                        title="每天花多少"
                        note={isThisMonth ? `平均一天 $${formatNumber(avgPerDay)}` : `有花費的天數 ${spentDays} 天`}
                    >
                        <div className="flex items-end gap-[2px] h-24 mb-1" onMouseLeave={() => setActiveDay(null)}>
                            {days.map(d => {
                                const h = maxDay.value > 0 ? (d.value / maxDay.value) * 100 : 0;
                                const isMax = d.value > 0 && d.day === maxDay.day;
                                const active = activeDay === d.day;
                                return (
                                    <div key={d.day}
                                        className="flex-1 h-full flex items-end cursor-pointer"
                                        onClick={() => setActiveDay(active ? null : d.day)}
                                        onMouseEnter={() => setActiveDay(d.day)}
                                        title={`${mm}/${d.day}　$${formatNumber(d.value)}`}>
                                        <div className="w-full rounded-t transition-all duration-300"
                                            style={{
                                                height: d.value > 0 ? `${Math.max(4, h)}%` : '2px',
                                                background: d.value === 0 ? '#F3F0EA' : (isMax || active ? MARK : '#EFC98A')
                                            }} />
                                    </div>
                                );
                            })}
                        </div>
                        <div className="flex justify-between text-[10px] text-gray-400 font-mono tabular-nums">
                            <span>1</span>
                            <span>{Math.round(daysInMonth / 2)}</span>
                            <span>{daysInMonth}</span>
                        </div>
                        <div className="mt-2 text-xs h-4">
                            {activeDay ? (
                                <span className="text-gray-600">
                                    {mm}/{activeDay}
                                    <span className="font-bold font-mono">${formatNumber(daily[activeDay] || 0)}</span>
                                </span>
                            ) : maxDay.value > 0 ? (
                                <span className="text-gray-400">
                                    花最多的是 {mm}/{maxDay.day}，
                                    <span className="font-bold font-mono text-gray-600">${formatNumber(maxDay.value)}</span>
                                </span>
                            ) : null}
                        </div>
                    </StatSection>

                    {/* ── 最大的幾筆 ── */}
                    {biggest.length > 0 && (
                        <StatSection title="最大的幾筆">
                            <div className="divide-y divide-gray-100">
                                {biggest.map((r, i) => (
                                    <div key={r.id || i} className="py-2.5 flex items-center justify-between gap-3 first:pt-0 last:pb-0">
                                        <div className="min-w-0">
                                            <div className="text-sm text-gray-700 truncate">{r.item}</div>
                                            <div className="text-[11px] text-gray-400">{r.date}　{r.categoryName}</div>
                                        </div>
                                        <span className="text-sm font-bold text-gray-800 font-mono tabular-nums flex-shrink-0">
                                            ${formatNumber(r.amount)}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        </StatSection>
                    )}

                    {truncated && (
                        <p className="text-[11px] text-gray-400 px-2 pt-1 leading-relaxed">
                            本月紀錄較多，「每天花多少」與「最大的幾筆」只採計最近 200 筆；上方的總額與類別排行是完整的。
                        </p>
                    )}
                </div>
            );
        };

        // 通行碼畫面：第一次使用時輸入一次，之後記在這台裝置上
        const LockScreen = ({ onUnlock, error }) => {
            const [value, setValue] = useState('');
            const inputRef = useRef(null);

            useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);

            const submit = (e) => {
                e.preventDefault();
                if (!value.trim()) return;
                onUnlock(value.trim());
            };

            return (
                <div className="flex flex-col h-full bg-amber-50 max-w-md mx-auto shadow-2xl items-center justify-center p-8">
                    <div className="w-full animate-fade-in-up">
                        <div className="text-center mb-8">
                            <div className="text-5xl mb-4">🌼</div>
                            <h1 className="text-2xl font-bold text-amber-900 mb-2">白花嘉麗媽記帳</h1>
                            <p className="text-sm text-amber-500">請輸入通行碼，只需要輸入這一次</p>
                        </div>

                        <form onSubmit={submit} className="space-y-4">
                            <input
                                ref={inputRef}
                                type="password"
                                value={value}
                                onChange={e => setValue(e.target.value)}
                                placeholder="通行碼"
                                autoComplete="current-password"

                        </p>
                    </div>

            );
        };

        // 記帳前的確認畫面：讓使用者在寫入前修正 AI 猜錯的分類
        const ConfirmModal = ({ items, categories, onConfirm, onCancel, isSaving }) => {
            const [rows, setRows] = useState(items);

            const setCat = (idx, categoryId) =>
                setRows(rs => rs.map((r, i) => i === idx ? { ...r, categoryId } : r));
            const removeRow = (idx) => setRows(rs => rs.filter((_, i) => i !== idx));

            const total = rows.reduce((sum, r) => sum + (Number(r.amount) || 0), 0);

            return (
                <div className="absolute inset-0 bg-black/40 z-30 flex items-end backdrop-blur-sm" onClick={isSaving ? undefined : onCancel}>
                    <div className="bg-white w-full rounded-t-3xl shadow-2xl animate-fade-in-up flex flex-col max-h-[85%]" onClick={e => e.stopPropagation()}>
                        <div className="px-6 pt-6 pb-3 flex-shrink-0">
                            <h3 className="font-bold text-lg text-amber-800">確認這幾筆</h3>
                            <p className="text-xs text-amber-500 mt-1">分類不對的話，點旁邊的選單改掉再確認</p>
                        </div>

                        <div className="flex-1 overflow-y-auto px-6 divide-y divide-gray-100">
                            {rows.length === 0 && (

                            {rows.map((r, idx) => (

                                    <div className="font-bold text-gray-800 font-mono flex-shrink-0">${formatNumber(r.amount)}</div>
                                    <select
                                        value={r.categoryId}
                                        onChange={e => setCat(idx, e.target.value)}
                                        className="border-2 border-amber-100 bg-amber-50/50 rounded-lg px-2 py-1.5 text-xs text-gray-700 outline-none focus:border-amber-300 max-w-[7.5rem] flex-shrink-0"
                                    >
                                        {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                    </select>
                                    <button onClick={() => removeRow(idx)} aria-label="不要記這筆"
                                        className="text-gray-200 hover:text-red-400 hover:bg-red-50 p-1.5 rounded-full transition-colors active:scale-90 flex-shrink-0">
                                        <Icons.Trash />
                                    </button>
                                </div>
                            ))}
                        </div>

                        <div className="px-6 py-4 border-t border-gray-100 flex-shrink-0 bg-white rounded-b-none">
                            <div className="flex justify-between items-center mb-3 text-sm">
                                <span className="text-gray-400">共 {rows.length} 筆</span>
                                <span className="font-bold text-amber-700 font-mono">${formatNumber(total)}</span>
                            </div>
                            <div className="flex gap-3">
                                <button onClick={onCancel} disabled={isSaving}
                                    className="flex-1 py-3 rounded-xl border-2 border-gray-100 text-gray-400 font-bold hover:bg-gray-50 hover:border-gray-200 transition-colors active:scale-95 disabled:opacity-50">取消</button>
                                <button onClick={() => onConfirm(rows)} disabled={isSaving || rows.length === 0}
                                    className="flex-[2] py-3 bg-amber-500 text-white rounded-xl font-bold shadow-lg shadow-amber-200 hover:bg-amber-600 transition-colors active:scale-95 disabled:opacity-50">
                                    {isSaving ? '記帳中...' : '確認記帳'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 編輯紀錄 Modal
        const EditModal = ({ record, categories, onSave, onCancel }) => {
            const [form, setForm] = useState({
                item: record.item,
                amount: record.amount,
                date: record.date.replace(/\//g, '-'),
                categoryId: record.categoryId,
            });
            const [isSaving, setIsSaving] = useState(false);

            const handleSave = async () => {
                if (!form.item.trim() || !form.amount || !form.date) return;
                if (!form.categoryId) return;   // 對不到類別的舊紀錄必須先選一個類別
                setIsSaving(true);
                await onSave({ ...form, amount: Number(form.amount) });
                setIsSaving(false);
            };

            return (
                <div className="absolute inset-0 bg-black/40 z-20 flex items-end backdrop-blur-sm" onClick={onCancel}>
                    <div className="bg-white w-full rounded-t-3xl p-6 shadow-2xl animate-fade-in-up" onClick={e => e.stopPropagation()}>
                        <h3 className="font-bold text-lg text-amber-800 mb-5">編輯紀錄</h3>
                        <div className="space-y-4 mb-6">
                            <div>
                                <label className="text-xs font-bold text-amber-500 ml-1 block mb-1">項目</label>
                                <input value={form.item} onChange={e => setForm(f => ({ ...f, item: e.target.value }))} className="w-full border-2 border-amber-100 bg-amber-50/50 p-3 rounded-xl outline-none focus:border-amber-300 text-gray-800" />
                            </div>
                            <div className="flex gap-3">
                                <div className="flex-1 min-w-0">
                                    <label className="text-xs font-bold text-amber-500 ml-1 block mb-1">金額</label>
                                    <input type="number" value={form.amount} onChange={e => setForm(f => ({ ...f, amount: e.target.value === '' ? '' : Number(e.target.value) }))} className="w-full border-2 border-amber-100 bg-amber-50/50 p-3 rounded-xl outline-none focus:border-amber-300 text-gray-800 font-mono" />
                                </div>
                                <div className="flex-1 min-w-0">
                                    <label className="text-xs font-bold text-amber-500 ml-1 block mb-1">日期</label>
                                    <input type="date" value={form.date} onChange={e => setForm(f => ({ ...f, date: e.target.value }))} className="w-full border-2 border-amber-100 bg-amber-50/50 p-3 rounded-xl outline-none focus:border-amber-300 text-gray-800" />

                                    {!form.categoryId && <option value="">請選擇類別（原本的「{record.categoryName}」已不存在）</option>}
                                    {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}

                        <div className="flex gap-3">

                            <button onClick={handleSave} disabled={isSaving || !form.categoryId} className="flex-1 py-3 bg-amber-500 text-white rounded-xl font-bold shadow-lg shadow-amber-200 hover:bg-amber-600 transition-colors active:scale-95 disabled:opacity-50">
                                {isSaving ? '儲存中...' : '儲存'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // 獨立出來的 HistoryView，避免在 App 內部定義導致的渲染問題
        const HistoryView = ({ history, currentMonth, onDelete, onEdit }) => {
            // 安全檢查：如果 history 不是陣列，則視為空陣列，防止當機
            const safeHistory = Array.isArray(history) ? history : [];

            return (
                <div className="p-4 pb-24 h-full overflow-y-auto">
                    <h2 className="text-xl font-bold mb-4 px-2 text-amber-900 flex items-center gap-2 animate-fade-in-up"><span>📜</span> {currentMonth} 紀錄</h2>
                    {safeHistory.length === 0 ? <div className="text-center text-gray-400 mt-20 flex flex-col gap-2 animate-fade-in-up stagger-1"><div className="text-4xl mb-2">🍃</div><span>本月暫無紀錄，來記一筆吧！</span></div> : (
                        <div className="space-y-3">
                            {safeHistory.map((record, index) => {
                                const noId = !record.id;
                                return (
                                <div key={record.id || `row-${index}`} className={`bg-white p-4 rounded-2xl shadow-sm border flex justify-between items-center group animate-fade-in-up stagger-${(index % 5) + 1} hover:shadow-md transition-shadow ${record.matched === false ? 'border-red-200' : 'border-amber-50'}`}>
                                    <div className="min-w-0">
                                        <div className="font-bold text-gray-800 flex items-center gap-2 truncate">{record.item}</div>
                                        <div className="text-xs text-amber-500 font-medium">{record.date}</div>
                                        <div className={`text-xs ${record.matched === false ? 'text-red-500 font-medium' : 'text-gray-400'}`}>
                                            {record.categoryName}
                                            {record.matched === false && ' · 此類別已不存在，沒有算進預算'}
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-3 flex-shrink-0">
                                        <span className="font-bold text-lg text-gray-800">${formatNumber(record.amount)}</span>
                                        <button onClick={() => onEdit(record)} disabled={noId} title={noId ? '這筆舊資料沒有編號，無法修改' : '編輯'}
                                            className="text-gray-200 hover:text-amber-400 hover:bg-amber-50 p-2 rounded-full transition-colors active:scale-90 disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-gray-200"><Icons.Edit /></button>
                                        <button onClick={() => onDelete(record)} disabled={noId} title={noId ? '這筆舊資料沒有編號，無法刪除' : '刪除'}
                                            className="text-gray-200 hover:text-red-400 hover:bg-red-50 p-2 rounded-full transition-colors active:scale-90 disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-gray-200"><Icons.Trash /></button>
                                    </div>
                                </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        // 獨立出來的 BudgetView
        const BudgetView = ({ categories, groups: groupInfo, unmatched, currentMonth, isLoading, onRefresh, onEdit }) => {
            // 群組若有「明確設定的預算」就用它，否則退回成員預算加總（維持舊行為）
            const explicitBudget = {};
            (groupInfo || []).forEach(g => { if (g.explicit) explicitBudget[g.name] = g.budget; });

            const renderCategories = () => {
                const groups = {};
                const standalone = [];

                categories.forEach(cat => {
                    if (cat.group) {
                        if (!groups[cat.group]) groups[cat.group] = { name: cat.group, items: [], totalBudget: 0, totalSpent: 0 };
                        groups[cat.group].items.push(cat);
                        // 【修正】使用 (Number(cat.budget) || 0) 確保空字串不會導致計算錯誤
                        groups[cat.group].totalBudget += (Number(cat.budget) || 0);
                        groups[cat.group].totalSpent += cat.spent;
                    } else {
                        standalone.push(cat);
                    }
                });

                const elements = [];

                Object.values(groups).forEach((group, groupIdx) => {
                    const budget = explicitBudget[group.name] !== undefined ? explicitBudget[group.name] : group.totalBudget;
                    const remaining = budget - group.totalSpent;
                    elements.push(
                        <div key={`group-${group.name}`} className={`mb-4 bg-white rounded-2xl shadow-sm border border-amber-100 overflow-hidden animate-fade-in-up stagger-${(groupIdx % 5) + 1} hover:shadow-md transition-shadow`}>
                            <div className="bg-amber-50/50 p-3 flex justify-between items-center border-b border-amber-100">
                                <div className="flex items-center gap-2">
                                    <div className="text-amber-500"><Icons.Folder /></div>
                                    <div className="font-bold text-amber-900">{group.name}</div>
                                </div>
                                <div className="text-right">
                                    <span className={`font-bold ${remaining < 0 ? 'text-red-500' : 'text-amber-700'}`}>${formatNumber(remaining)}</span>
                                    <span className="text-xs text-amber-400 ml-1">/ ${formatNumber(budget)}</span>
                                </div>
                            </div>
                            <div className="divide-y divide-gray-100">
                                {group.items.map((item, idx) => (
                                    <div key={item.id} className="p-3 pl-6 flex justify-between items-center bg-white hover:bg-gray-50 transition-colors">
                                        <div className="flex items-center gap-3">
                                            <div className="w-2 h-2 rounded-full" style={{ background: COLORS[idx % COLORS.length] }}></div>
                                            <div>
                                                <div className="font-medium text-gray-700 text-sm">{item.name}</div>
                                                {/* 這裡不再顯示預算，只顯示花費 */}
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-xs text-gray-400 mr-1">花費</span>
                                            <span className="font-bold text-gray-700">${formatNumber(item.spent)}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                });

                standalone.forEach((item, idx) => {
                    const remaining = item.budget - item.spent;
                    elements.push(
                        <div key={item.id} className={`bg-white rounded-2xl p-4 shadow-sm border border-amber-100 flex justify-between items-center relative overflow-hidden mb-3 animate-fade-in-up stagger-${((Object.keys(groups).length + idx) % 5) + 1} hover:shadow-md transition-shadow`}>
                            <div className={`absolute left-0 top-0 bottom-0 w-1.5 opacity-80`} style={{ background: COLORS[idx % COLORS.length] }}></div>
                            <div className="flex items-center gap-3 pl-2">
                                <div className="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-lg shadow-sm" style={{ background: COLORS[idx % COLORS.length] }}>{item.name[0]}</div>
                                <div><div className="font-bold text-gray-800">{item.name}</div><div className="text-xs text-gray-400">已花 ${formatNumber(item.spent)}</div></div>
                            </div>
                            <div className="text-right"><div className={`font-bold text-lg ${remaining < 0 ? 'text-red-500' : 'text-gray-800'}`}>${formatNumber(remaining)}</div><div className="text-xs text-gray-400">/ ${formatNumber(item.budget)}</div></div>
                        </div>
                    );
                });

                return elements;
            };

            // 總預算 = 沒分組的類別預算 + 各群組預算（群組有明確設定就用它，否則用成員加總）
            const totalBudget = categories.reduce((acc, c) => c.group ? acc : acc + (Number(c.budget) || 0), 0)
                + Object.keys(
                    categories.reduce((m, c) => { if (c.group) m[c.group] = true; return m; }, {})
                ).reduce((acc, name) => {
                    if (explicitBudget[name] !== undefined) return acc + explicitBudget[name];
                    return acc + categories.reduce((s, c) => c.group === name ? s + (Number(c.budget) || 0) : s, 0);
                }, 0);

            const totalSpent = categories.reduce((acc, c) => acc + (Number(c.spent) || 0), 0);

            return (
                <div className="space-y-3 pb-24 p-4 overflow-y-auto h-full">
                    {isLoading && <div className="text-center p-2 text-amber-600 text-xs animate-pulse">正在讀取 {currentMonth} 資料...</div>}

                    {unmatched && unmatched.count > 0 && (
                        <div className="bg-red-50 border border-red-200 text-red-700 rounded-2xl p-3.5 text-xs animate-fade-in-up">
                            <div className="font-bold mb-1">有 {unmatched.count} 筆花費（共 ${formatNumber(unmatched.total)}）沒有算進預算</div>
                            <div className="text-red-500 leading-relaxed">
                                這些紀錄的類別「{(unmatched.names || []).join('、')}」在本月設定裡不存在，可能是類別被改名或刪除了。到「紀錄」頁把它們改成正確的類別就會納入計算。
                            </div>
                        </div>
                    )}

                    <div className="bg-amber-400 rounded-3xl p-5 text-white shadow-lg mb-6 relative overflow-hidden transition-all animate-fade-in-up">
                        <div className="absolute top-0 right-0 w-32 h-32 bg-white opacity-10 rounded-full blur-2xl -mr-10 -mt-10"></div>

                        <div className="flex justify-between items-start mb-5 relative z-10">
                            <div className="flex items-center gap-1 bg-white/20 px-2 py-1.5 rounded-xl backdrop-blur-md border border-white/20 hover:bg-white/30 transition-colors">
                                <span className="text-amber-50 text-xs">📅</span>
                                <input type="month" value={currentMonth} onChange={onRefresh} className="bg-transparent text-white text-sm font-bold outline-none border-none p-0 w-[110px] cursor-pointer placeholder-white" />
                            </div>
                            <button onClick={onRefresh} className="text-amber-50 hover:text-white hover:rotate-90 transition-transform bg-white/10 p-2 rounded-full backdrop-blur-sm shadow-sm flex-shrink-0"><Icons.Refresh /></button>
                        </div>

                        <div className="relative z-10 flex justify-between items-end">
                            <div>
                                <div className="text-amber-100 text-xs font-bold mb-1 tracking-wider">本月剩餘預算</div>
                                {/* 【修正】計算總剩餘時加入防呆，避免空預算導致 NaN */}
                                <div className="text-4xl font-bold tracking-tight text-white drop-shadow-sm">${formatNumber(totalBudget - totalSpent)}</div>
                            </div>
                            <div className="text-right">
                                <div className="text-amber-100 text-xs font-bold mb-1 tracking-wider">總預算</div>
                                <div className="text-2xl font-bold tracking-tight text-amber-50 drop-shadow-sm">${formatNumber(totalBudget)}</div>
                            </div>
                        </div>

                        <div className="h-3 bg-black/10 rounded-full overflow-hidden flex p-0.5 mt-4 relative z-10">
                            {categories.map((c, i) => <div key={c.id} style={{ width: `${Math.min(100, (c.spent / Math.max(1, totalBudget)) * 100)}%`, background: COLORS[i % COLORS.length] }} className="h-full rounded-full transition-all duration-500" />)}
                        </div>
                    </div>

                    {renderCategories()}

                    <div className="text-center pt-2 pb-8 animate-fade-in-up stagger-5">
                        {isLoading ? (
                            <span className="text-amber-400 text-sm flex items-center justify-center gap-2 mx-auto bg-amber-50 py-2 px-4 rounded-full w-fit"><Icons.Refresh /> 同步資料中...</span>
                        ) : (
                            <button onClick={onEdit} className="text-amber-500 font-medium text-sm flex items-center justify-center gap-1.5 mx-auto bg-white py-2 px-4 rounded-full shadow-sm border border-amber-100 hover:bg-amber-50 hover:text-amber-600 transition-all active:scale-95"><Icons.Edit /> 編輯類別與預算</button>
                        )}
                    </div>
                </div>
            );
        };

        function App() {
            const [view, setView] = useState('budget');
            const [isLoading, setIsLoading] = useState(false);
            const [categories, setCategories] = useState([]);
            const [history, setHistory] = useState([]); // 初始化為空陣列
            const [currentMonth, setCurrentMonth] = useState(() => {
                const now = new Date();
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            });

            const [input, setInput] = useState('');
            // 輸入框會隨內容長高，最多到 MAX_INPUT_HEIGHT 就開始捲動
            const inputBoxRef = useRef(null);
            const MAX_INPUT_HEIGHT = 132;
            const [isProcessing, setIsProcessing] = useState(false);
            const [isEditing, setIsEditing] = useState(false);
            const [categoriesSnapshot, setCategoriesSnapshot] = useState([]);
            const [editingRecord, setEditingRecord] = useState(null);
            const [lastLog, setLastLogState] = useState(null);

            // AI 拆解完、等待使用者確認的項目（null = 沒有待確認的）
            const [pendingTx, setPendingTx] = useState(null);
            const [isCommitting, setIsCommitting] = useState(false);
            // 群組預算與「對不到類別的花費」，皆由後端提供
            const [groups, setGroups] = useState([]);
            const [groupBudgetDraft, setGroupBudgetDraft] = useState({});
            const [unmatched, setUnmatched] = useState(null);

            // 通行碼：從瀏覽器讀出來，沒有的話就顯示輸入畫面
            const [token, setToken] = useState(() => {
                try { return localStorage.getItem(TOKEN_STORAGE_KEY) || ''; } catch (e) { return ''; }
            });
            const [authError, setAuthError] = useState('');

            // 覆寫 setLastLog，加上 3.5 秒後自動消失的機制
            const setLastLog = (logObj) => {
                setLastLogState(logObj);
                if (logObj) {
                    setTimeout(() => {
                        // 檢查如果目前的 log 還是原本那一個，才把它清掉（避免清到後來新彈出的訊息）
                        setLastLogState(prev => prev === logObj ? null : prev);
                    }, 3500);
                }
            };

            // 有通行碼才去讀資料
            useEffect(() => { if (token) loadDataFromCloud(currentMonth); }, [currentMonth, token]);

            // 依內容調整輸入框高度。放在 effect 裡是因為送出後 input 會被程式清空，
            // 只在 onChange 調整的話高度會留在原地縮不回來。
            useEffect(() => {
                const el = inputBoxRef.current;
                if (!el) return;
                el.style.height = 'auto';
                el.style.height = Math.min(el.scrollHeight, MAX_INPUT_HEIGHT) + 'px';
            }, [input, view, isEditing]);

            // 通行碼錯誤時清掉，退回輸入畫面
            const clearToken = (msg) => {
                try { localStorage.removeItem(TOKEN_STORAGE_KEY); } catch (e) { }
                setToken('');
                setAuthError(msg || '通行碼錯誤，請重新輸入');
            };

            const handleUnlock = (value) => {
                try { localStorage.setItem(TOKEN_STORAGE_KEY, value); } catch (e) { }
                setAuthError('');
                setToken(value);
            };

            // --- Cloud API Wrapper ---
            const callBackend = async (action, payload = {}) => {
                if (!GOOGLE_SCRIPT_URL) throw new Error("請在程式碼中設定 Google Script URL");
                const body = JSON.stringify({ action, token, ...payload });

                // Google 伺服器偶爾會沒有回應，設定逾時避免畫面無限轉圈
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

                let response;
                try {
                    response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST', mode: 'cors', redirect: 'follow',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: body,
                        signal: controller.signal
                    });
                } catch (err) {
                    if (err.name === 'AbortError') {
                        throw new Error(`連線逾時（超過 ${REQUEST_TIMEOUT_MS / 1000} 秒沒有回應），請確認網路後再試一次`);
                    }
                    throw new Error("連不上伺服器，請確認網路後再試一次");
                } finally {
                    clearTimeout(timer);
                }

                if (!response.ok) throw new Error("網路連線錯誤");
                const json = await response.json();
                if (json.status === 'error') {
                    if (json.code === 'unauthorized') {
                        clearToken('通行碼錯誤，請重新輸入');
                    }
                    throw new Error(json.message || "Unknown API Error");
                }
                return json;
            };

            const loadDataFromCloud = async (monthToLoad) => {
                setIsLoading(true);
                try {
                    const data = await callBackend('getData', { month: monthToLoad });
                    if (data) {
                        setCategories(data.categories || []);
                        setHistory(data.history || []); // 強制給予空陣列，防止 undefined
                        setGroups(data.groups || []);
                        setUnmatched(data.unmatched && data.unmatched.count > 0 ? data.unmatched : null);
                        setLastLog({ msg: `已讀取 ${monthToLoad} 資料`, type: 'success' });
                    }
                } catch (err) {
                    console.error(err);
                    setLastLog({ msg: "讀取失敗: " + err.message, type: 'error' });
                } finally {
                    setIsLoading(false);
                }
            };

            const handleMonthChange = (e) => {
                // 區分是更改月份還是點擊更新按鈕
                if (e && e.target && e.target.tagName === 'INPUT') {
                    setCurrentMonth(e.target.value);
                } else {
                    // 如果是點擊重整按鈕，直接強制更新當前月份資料
                    loadDataFromCloud(currentMonth);
                }
            };

            const saveCategoriesToCloud = async (newCategories, newGroupBudgets) => {
                setCategories(newCategories);
                const budgets = newGroupBudgets !== undefined ? newGroupBudgets : groupBudgetDraft;
                try {
                    // 將當前月份也傳送過去，讓後端可以獨立儲存
                    await callBackend('saveConfig', {
                        categories: newCategories,
                        groupBudgets: budgets,
                        month: currentMonth
                    });
                    setLastLog({ msg: `${currentMonth} 的類別設定已儲存`, type: 'success' });
                    loadDataFromCloud(currentMonth);   // 重新取回，讓群組預算等衍生資料保持一致
                } catch (e) {
                    setLastLog({ msg: "儲存設定失敗: " + e.message, type: 'error' });
                }
            };

            const deleteTransaction = async (record) => {
                // 沒有編號的舊資料不能刪 —— 硬刪會刪到別筆
                if (!record.id) {
                    setLastLog({ msg: '這筆是舊資料、沒有編號，無法在 App 裡刪除，請直接到試算表處理', type: 'error' });
                    return;
                }
                if (!confirm(`確定要刪除「${record.item} $${record.amount}」嗎？`)) return;

                // 先記住原始狀態，失敗時要還原，避免畫面顯示已刪除但雲端還在
                const prevCategories = categories;
                const prevHistory = history;

                setCategories(cats => cats.map(c => c.id === record.categoryId ? { ...c, spent: c.spent - record.amount } : c));
                setHistory(prev => prev.filter(r => r.id !== record.id));

                try {
                    const res = await callBackend('deleteData', { id: record.id });
                    if (res.status === 'deleted') {
                        setLastLog({ msg: "刪除成功", type: 'success' });
                    } else {
                        setCategories(prevCategories);
                        setHistory(prevHistory);
                        setLastLog({ msg: '找不到這筆資料，畫面已還原', type: 'error' });
                    }
                } catch (e) {
                    setCategories(prevCategories);
                    setHistory(prevHistory);
                    setLastLog({ msg: "刪除失敗，畫面已還原: " + e.message, type: 'error' });
                }
            };

            const handleEditSave = async (formData) => {
                const old = editingRecord;
                const newMonth = formData.date.slice(0, 7); // YYYY-MM
                const newDateDisplay = formData.date.replace(/-/g, '/'); // YYYY/MM/DD

                let updatedCategories = [...categories];
                // 還原舊資料對當前月份預算的影響
                if (old.month === currentMonth) {
                    updatedCategories = updatedCategories.map(c =>
                        c.id === old.categoryId ? { ...c, spent: c.spent - old.amount } : c
                    );
                }
                // 套用新資料對當前月份預算的影響
                if (newMonth === currentMonth) {
                    updatedCategories = updatedCategories.map(c =>
                        c.id === formData.categoryId ? { ...c, spent: c.spent + formData.amount } : c
                    );
                }

                const newCategory = categories.find(c => c.id === formData.categoryId);
                const updatedItem = {
                    ...old,
                    item: formData.item,
                    amount: formData.amount,
                    date: newDateDisplay,
                    month: newMonth,
                    categoryId: formData.categoryId,
                    categoryName: newCategory?.name || old.categoryName,
                };

                // 先記住原始狀態，失敗時要還原
                const prevCategories = categories;
                const prevHistory = history;

                setCategories(updatedCategories);
                // 若月份改變，從當前月份紀錄移除；否則更新
                if (newMonth === currentMonth) {
                    setHistory(prev => prev.map(r => r.id === old.id ? updatedItem : r));
                } else {
                    setHistory(prev => prev.filter(r => r.id !== old.id));
                }
                setEditingRecord(null);

                try {
                    const res = await callBackend('updateData', {
                        id: old.id,
                        item: formData.item,
                        amount: formData.amount,
                        date: formData.date,
                        category: newCategory?.name || old.categoryName,
                        categoryId: formData.categoryId,
                    });
                    if (res.status === 'updated') {
                        setLastLog({ msg: '編輯成功', type: 'success' });
                    } else {
                        setCategories(prevCategories);
                        setHistory(prevHistory);
                        setLastLog({ msg: '找不到這筆資料，畫面已還原', type: 'error' });
                    }
                } catch (e) {
                    setCategories(prevCategories);
                    setHistory(prevHistory);
                    setLastLog({ msg: '編輯失敗，畫面已還原: ' + e.message, type: 'error' });
                }
            };

            const processInput = async (e) => {
                e.preventDefault();
                if (!input.trim() || isProcessing || isLoading) return;
                setIsProcessing(true); setLastLog(null);

                try {
                    // 修復：不使用 toISOString 因為在台灣早上 8 點前會跨日變昨天
                    const now = new Date();
                    const currentDate = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;

                    const result = await callBackend('analyze', { text: input, categories: categories, currentDate: currentDate });

                    if (!result || !result.data || !result.data.transactions || result.data.transactions.length === 0) {
                        throw new Error("無法辨識任何交易");
                    }

                    // 準備確認清單：先把 AI 給的分類對到實際存在的類別，
                    // 對不到的一律落在「其他」，讓使用者在確認畫面自行改正。
                    const fallback = categories.find(c => c.name === '其他') || categories[0];
                    if (!fallback) throw new Error("目前沒有任何類別，請先到「編輯類別與預算」新增");

                    const pending = result.data.transactions.map(tx => {
                        let cat = categories.find(c => c.id === tx.categoryId);
                        if (!cat) cat = categories.find(c => c.name === tx.item);
                        if (!cat) cat = categories.find(c => tx.item && c.name.includes(tx.item));
                        if (!cat) cat = fallback;
                        return {
                            item: tx.item,
                            amount: Number(tx.amount) || 0,
                            date: (tx.date || currentDate).replace(/\//g, '-'),
                            categoryId: cat.id,
                        };
                    });

                    setPendingTx(pending);

                } catch (error) {
                    console.error(error);
                    setLastLog({ msg: error.message || "發生錯誤", type: 'error' });
                } finally {
                    setIsProcessing(false);
                }
            };

            // 使用者在確認畫面按下「確認記帳」之後才真正寫入
            const commitTransactions = async (rows) => {
                setIsCommitting(true);
                try {
                    const newHistoryItems = [];
                    const apiPromises = [];
                    let updatedCategories = categories.map(c => ({ ...c }));

                    for (const tx of rows) {
                        const targetCat = updatedCategories.find(c => c.id === tx.categoryId);
                        if (!targetCat) continue;

                        const recordId = Math.random().toString(36).slice(2, 11) + Date.now().toString();
                        const txDate = tx.date;                       // YYYY-MM-DD
                        const txMonth = txDate.slice(0, 7);

                        if (txMonth === currentMonth) {
                            targetCat.spent += tx.amount;
                            newHistoryItems.push({
                                id: recordId, date: txDate.replace(/-/g, '/'), month: currentMonth,
                                item: tx.item, amount: tx.amount,
                                categoryId: targetCat.id, categoryName: targetCat.name, note: '', matched: true
                            });
                        }

                        apiPromises.push(callBackend('addData', {
                            date: txDate, month: txMonth,
                            category: targetCat.name, categoryId: targetCat.id,
                            item: tx.item, amount: tx.amount, note: '', id: recordId
                        }));
                    }

                    const apiResults = await Promise.allSettled(apiPromises);
                    const failedCount = apiResults.filter(r => r.status === 'rejected').length;

                    if (failedCount === apiPromises.length && apiPromises.length > 0) {
                        // 全部失敗：畫面不要顯示假的成功結果
                        setLastLog({ msg: '記帳失敗，一筆都沒有存到，請檢查網路後再試一次', type: 'error' });
                    } else {
                        setCategories(updatedCategories);
                        setHistory(prev => [...newHistoryItems, ...prev].slice(0, 200));
                        const total = rows.reduce((acc, cur) => acc + cur.amount, 0);
                        if (failedCount > 0) {
                            setLastLog({ msg: `有 ${failedCount} 筆沒存到，請下拉重整確認`, type: 'error' });
                        } else {
                            setLastLog({ msg: `記帳成功！共 ${rows.length} 筆 ($${formatNumber(total)})`, type: 'success' });
                        }
                        setInput('');
                        setPendingTx(null);
                    }
                } catch (error) {
                    console.error(error);
                    setLastLog({ msg: error.message || "記帳失敗", type: 'error' });
                } finally {
                    setIsCommitting(false);
                }
            };

            // 還沒輸入通行碼 → 只顯示通行碼畫面
            if (!token) {
                return <LockScreen onUnlock={handleUnlock} error={authError} />;
            }

            return (
                <div className="flex flex-col h-full bg-amber-50 max-w-md mx-auto shadow-2xl relative">
                    <div className="flex-1 overflow-hidden relative">
                        {view === 'budget' && <BudgetView
                            categories={categories}
                            groups={groups}
                            unmatched={unmatched}
                            currentMonth={currentMonth}
                            isLoading={isLoading}
                            onRefresh={handleMonthChange}
                            onEdit={() => {
                                setCategoriesSnapshot(categories.map(c => ({ ...c })));
                                const draft = {};
                                groups.forEach(g => { draft[g.name] = g.explicit ? g.budget : ''; });
                                setGroupBudgetDraft(draft);
                                setIsEditing(true);
                            }}
                        />}
                        {view === 'history' && <HistoryView
                            history={history}
                            currentMonth={currentMonth}
                            onDelete={deleteTransaction}
                            onEdit={setEditingRecord}
                        />}
                        {view === 'stats' && <StatsView
                            categories={categories}
                            groups={groups}
                            history={history}
                            currentMonth={currentMonth}
                            isLoading={isLoading}
                        />}

                        {pendingTx && (
                            <ConfirmModal
                                items={pendingTx}
                                categories={categories}
                                isSaving={isCommitting}
                                onConfirm={commitTransactions}
                                onCancel={() => setPendingTx(null)}
                            />
                        )}

                        {editingRecord && (
                            <EditModal
                                record={editingRecord}
                                categories={categories}
                                onSave={handleEditSave}
                                onCancel={() => setEditingRecord(null)}
                            />
                        )}

                        {isEditing && view === 'budget' && (
                            <div className="absolute inset-0 bg-amber-50 z-10 flex flex-col backdrop-blur-sm">
                                <div className="p-4 pb-3 border-b border-amber-100 bg-white/80 flex justify-between items-center">
                                    <div>
                                        <h3 className="font-bold text-base text-amber-900">類別與預算</h3>
                                        <div className="text-xs text-amber-400">{currentMonth}</div>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => { setCategories(categoriesSnapshot); setIsEditing(false); }} className="px-4 py-2 rounded-xl border-2 border-gray-100 text-gray-400 font-bold text-sm hover:bg-gray-50 hover:border-gray-200 transition-colors active:scale-95">取消</button>
                                        <button onClick={() => { setIsEditing(false); saveCategoriesToCloud(categories); }} className="px-4 py-2 bg-amber-500 text-white rounded-xl font-bold text-sm shadow-sm shadow-amber-200 hover:bg-amber-600 transition-colors active:scale-95">儲存</button>
                                    </div>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 pb-8 space-y-3">
                                    {categories.map((c, idx) => (
                                        <div key={c.id} className="bg-white rounded-2xl shadow-sm border border-amber-100 overflow-hidden">
                                            <div className="flex items-center gap-3 p-4 pb-3">
                                                <div className="w-3 h-3 rounded-full flex-shrink-0" style={{ background: COLORS[idx % COLORS.length] }}></div>
                                                <input value={c.name} onChange={e => setCategories(cats => cats.map(x => x.id === c.id ? { ...x, name: e.target.value } : x))} className="flex-1 min-w-0 font-bold text-gray-800 outline-none bg-transparent text-base placeholder-gray-300" placeholder="類別名稱" />
                                                <button onClick={() => { if (confirm('刪除這個類別?')) setCategories(cats => cats.filter(x => x.id !== c.id)) }} className="text-gray-200 hover:text-red-400 hover:bg-red-50 transition-colors p-2 rounded-full active:scale-90"><Icons.Trash /></button>
                                            </div>
                                            <div className="flex gap-0 border-t border-gray-50">
                                                <div className="flex-1 min-w-0 px-4 py-2.5 border-r border-gray-50">
                                                    <div className="text-xs text-gray-400 mb-1">每月預算</div>
                                                    <div className="flex items-center gap-1">
                                                        <span className="text-amber-400 font-bold text-sm">$</span>
                                                        <input type="number" value={c.budget} onChange={e => setCategories(cats => cats.map(x => x.id === c.id ? { ...x, budget: e.target.value === '' ? '' : Number(e.target.value) } : x))} className="w-full outline-none text-gray-800 font-mono font-bold bg-transparent text-sm" placeholder="0" />
                                                    </div>
                                                </div>
                                                <div className="flex-1 min-w-0 px-4 py-2.5">
                                                    <div className="text-xs text-gray-400 mb-1">群組</div>
                                                    <input value={c.group || ''} onChange={e => setCategories(cats => cats.map(x => x.id === c.id ? { ...x, group: e.target.value } : x))} className="w-full outline-none text-gray-700 bg-transparent text-sm placeholder-gray-300" placeholder="無" />
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                    <button onClick={() => setCategories([...categories, { id: Date.now().toString(), name: '新類別', budget: 0, spent: 0, group: '' }])} className="w-full py-3.5 border-2 border-dashed border-amber-200 rounded-2xl text-amber-400 hover:bg-amber-50 transition-colors font-bold flex items-center justify-center gap-2 text-sm"><Icons.Plus /> 新增類別</button>

                                    {/* 群組預算：直接設定整個群組的額度，不用再把金額硬塞在某個類別上 */}
                                    {[...new Set(categories.map(c => c.group).filter(Boolean))].length > 0 && (
                                        <div className="pt-4">
                                            <div className="flex items-center gap-2 mb-1 px-1">
                                                <div className="text-amber-500"><Icons.Folder /></div>
                                                <h4 className="font-bold text-sm text-amber-900">群組預算</h4>
                                            </div>
                                            <p className="text-xs text-amber-400/90 mb-3 px-1 leading-relaxed">
                                                填了就用這個數字當整個群組的預算。留白的話，維持用群組內各類別的預算加總。
                                            </p>
                                            <div className="space-y-2">
                                                {[...new Set(categories.map(c => c.group).filter(Boolean))].map(name => {
                                                    const memberSum = categories.reduce((s, c) => c.group === name ? s + (Number(c.budget) || 0) : s, 0);
                                                    return (
                                                        <div key={name} className="bg-white rounded-2xl shadow-sm border border-amber-100 px-4 py-3 flex items-center gap-3">
                                                            <div className="flex-1 min-w-0">
                                                                <div className="font-bold text-gray-800 text-sm truncate">{name}</div>
                                                                <div className="text-xs text-gray-400">成員加總 ${formatNumber(memberSum)}</div>
                                                            </div>
                                                            <div className="flex items-center gap-1 flex-shrink-0">
                                                                <span className="text-amber-400 font-bold text-sm">$</span>
                                                                <input
                                                                    type="number"
                                                                    value={groupBudgetDraft[name] === undefined ? '' : groupBudgetDraft[name]}
                                                                    onChange={e => setGroupBudgetDraft(d => ({ ...d, [name]: e.target.value === '' ? '' : Number(e.target.value) }))}
                                                                    placeholder={String(memberSum)}
                                                                    className="w-24 text-right outline-none text-gray-800 font-mono font-bold bg-transparent text-sm placeholder-gray-300"
                                                                />
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>

                    {view === 'budget' && !isEditing && (
                        <div className="absolute bottom-24 left-0 right-0 px-4">
                            {lastLog && <div className={`text-xs mb-3 px-4 py-2.5 rounded-xl w-fit shadow-md max-w-full font-medium border animate-bounce-slight ${lastLog.type === 'success' ? 'bg-green-50 text-green-700 border-green-200' : 'bg-red-50 text-red-700 border-red-200'}`}>{lastLog.msg}</div>}
                            {/* items-end：輸入框長高時，左邊的圖示與右邊的送出鈕留在底部 */}
                            <form onSubmit={processInput} className="glass-panel p-2 rounded-[24px] shadow-lg flex items-end gap-2">
                                <div className="p-2 text-amber-500 animate-pulse"><Icons.Sparkles /></div>
                                {/* textarea 而不是 input：Enter 是換行，送出一律要按右邊的按鈕 */}
                                <textarea ref={inputBoxRef} rows={1} value={input} onChange={e => setInput(e.target.value)} disabled={isProcessing || isLoading} placeholder={isLoading ? "同步資料中..." : "輸入: 早餐65, 捷運25..."} className="flex-1 min-w-0 outline-none text-gray-700 placeholder-gray-400 font-medium bg-transparent py-2 resize-none overflow-y-auto leading-6 block" />
                                <button disabled={!input.trim() || isProcessing || isLoading} className="bg-amber-500 text-white p-3.5 rounded-[20px] disabled:opacity-50 hover:bg-amber-600 transition-all active:scale-90 shadow-md shadow-amber-200/50">
                                    {isProcessing ? <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin" /> : <Icons.Send />}
                                </button>
                            </form>
                        </div>
                    )}

                    <div className="glass-panel border-t-0 p-2 flex justify-around items-center z-20 pb-safe rounded-t-[32px] mx-2 mb-2 shadow-[0_-8px_30px_rgba(251,191,36,0.1)]">
                        <button onClick={() => setView('budget')} className={`py-3 px-6 rounded-2xl flex flex-col items-center gap-1.5 transition-all duration-300 ${view === 'budget' ? 'text-amber-600 bg-amber-100 scale-105 font-bold shadow-sm' : 'text-gray-400 hover:bg-white/50'}`}><Icons.Home /> <span className="text-[10px]">記帳</span></button>
                        <button onClick={() => setView('history')} className={`py-3 px-6 rounded-2xl flex flex-col items-center gap-1.5 transition-all duration-300 ${view === 'history' ? 'text-amber-600 bg-amber-100 scale-105 font-bold shadow-sm' : 'text-gray-400 hover:bg-white/50'}`}><Icons.List /> <span className="text-[10px]">紀錄</span></button>
                        <button onClick={() => setView('stats')} className={`py-3 px-6 rounded-2xl flex flex-col items-center gap-1.5 transition-all duration-300 ${view === 'stats' ? 'text-amber-600 bg-amber-100 scale-105 font-bold shadow-sm' : 'text-gray-400 hover:bg-white/50'}`}><Icons.PieChart /> <span className="text-[10px]">統計</span></button>
                    </div>


                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
